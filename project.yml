name: Scratchpad
options:
  bundleIdPrefix: com.scratchpad
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES
targets:
  Scratchpad:
    type: application
    platform: macOS
    sources:
      - path: Scratchpad/App/AppCommands.swift
      - path: Scratchpad/App/AppDelegate.swift
      - path: Scratchpad/App/ApplicationModel.swift
      - path: Scratchpad/App/ApplicationServices.swift
      - path: Scratchpad/App/DocumentDecisionCoordinator.swift
      - path: Scratchpad/App/FilePanelProvider.swift
      - path: Scratchpad/App/LifecycleCoordinators.swift
      - path: Scratchpad/App/MainWindowView.swift
      - path: Scratchpad/App/ScratchpadApp.swift
      - path: Scratchpad/Document/DocumentSession.swift
      - path: Scratchpad/Document/DocumentMetrics.swift
      - path: Scratchpad/Document/MetricsCoordinator.swift
      - path: Scratchpad/Document/DocumentSnapshot.swift
      - path: Scratchpad/Document/DocumentState.swift
      - path: Scratchpad/Editor/EditorCoordinator.swift
      - path: Scratchpad/Editor/EditorCommand.swift
      - path: Scratchpad/Editor/EditorCommandRouter.swift
      - path: Scratchpad/Editor/EditorHost.swift
      - path: Scratchpad/Editor/LineTable.swift
      - path: Scratchpad/Editor/ScratchTextView.swift
      - path: Scratchpad/Files/FileModels.swift
      - path: Scratchpad/Files/FileResults.swift
      - path: Scratchpad/Files/ExternalChangeMonitor.swift
      - path: Scratchpad/Files/FileService.swift
      - path: Scratchpad/Persistence/ApplicationSupportPaths.swift
      - path: Scratchpad/Persistence/AtomicFileWriter.swift
      - path: Scratchpad/Persistence/BookmarkStore.swift
      - path: Scratchpad/Persistence/PersistenceRecords.swift
      - path: Scratchpad/Persistence/RecoveryCoordinator.swift
      - path: Scratchpad/Persistence/SessionRepository.swift
      - path: Scratchpad/Settings/LaunchAtLoginService.swift
      - path: Scratchpad/Settings/FontPanelCoordinator.swift
      - path: Scratchpad/Settings/SettingsStore.swift
      - path: Scratchpad/Settings/SettingsView.swift
      - path: Scratchpad/Settings/ThemeDefinition.swift
      - path: Scratchpad/UI/DocumentTitleView.swift
      - path: Scratchpad/UI/ErrorBannerView.swift
      - path: Scratchpad/UI/InformationBarView.swift
      - path: Scratchpad/UI/ThemePreviewView.swift
      - path: Scratchpad/UI/WindowChromeConfigurator.swift
      - path: Scratchpad/Utilities/ContentHash.swift
      - path: Scratchpad/Utilities/Log.swift
      - path: Scratchpad/Assets.xcassets
    settings:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_ENTITLEMENTS: Scratchpad/App/Scratchpad.entitlements
      INFOPLIST_FILE: Scratchpad/App/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.scratchpad.app
  ScratchpadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ScratchpadTests/SmokeTests.swift
      - ScratchpadTests/RecoveryProjectPolicyTests.swift
      - ScratchpadTests/App/ApplicationModelTests.swift
      - ScratchpadTests/App/AppCommandsTests.swift
      - ScratchpadTests/App/ApplicationLifecycleTests.swift
      - ScratchpadTests/App/DocumentDecisionCoordinatorTests.swift
      - ScratchpadTests/Document/DocumentStateTests.swift
      - ScratchpadTests/Document/DocumentSessionTests.swift
      - ScratchpadTests/Document/DocumentMetricsTests.swift
      - ScratchpadTests/Document/MetricsCoordinatorTests.swift
      - ScratchpadTests/Editor/EditorHostTests.swift
      - ScratchpadTests/Editor/EditorCoordinatorTests.swift
      - ScratchpadTests/Editor/LineTableTests.swift
      - ScratchpadTests/Editor/EditorCommandRouterTests.swift
      - ScratchpadTests/Editor/ScratchTextViewCommandTests.swift
      - ScratchpadTests/Persistence/AtomicFileWriterTests.swift
      - ScratchpadTests/Persistence/BookmarkStoreTests.swift
      - ScratchpadTests/Persistence/RecoveryCoordinatorTests.swift
      - ScratchpadTests/Persistence/SessionRepositoryTests.swift
      - ScratchpadTests/Settings/SettingsStoreTests.swift
      - ScratchpadTests/Settings/ThemeDefinitionTests.swift
      - ScratchpadTests/Settings/FontPanelCoordinatorTests.swift
      - ScratchpadTests/UI/PresentationModelTests.swift
      - ScratchpadTests/Files/FileServiceTests.swift
      - ScratchpadTests/Files/ExternalChangeMonitorTests.swift
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Scratchpad
  ScratchpadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - ScratchpadUITests/AccessibilityUITests.swift
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Scratchpad
schemes:
  Scratchpad:
    build: { targets: { Scratchpad: all } }
    test: { targets: [ScratchpadTests, ScratchpadUITests] }
